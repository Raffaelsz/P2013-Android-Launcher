name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master, principal]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name 'PES2013_Android_Launcher_Com_Build_Automatico.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: arquivo ZIP não encontrado."
            exit 1
          fi

          mkdir -p /tmp/pes-project
          unzip -o "$ZIP" -d /tmp/pes-project

          SETTINGS=$(find /tmp/pes-project -name 'settings.gradle.kts' -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find /tmp/pes-project -name 'settings.gradle' -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: arquivo settings.gradle não encontrado no ZIP."
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          cp -a "$ROOT"/. .

          echo "Arquivos do projeto:"
          ls -la
          ls -la app

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PES2013-Android-APK
          path: app/build/outputs/apk/debug/*.apk
