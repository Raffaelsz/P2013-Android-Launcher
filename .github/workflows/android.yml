name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master, principal]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar e extrair projeto
        run: |
          ZIP=$(find . -maxdepth 2 -name 'PES2013_Android_Launcher_Com_Build_Automatico.zip' -print -quit)
          if [ -n "$ZIP" ]; then
            mkdir -p /tmp/pes-project
            unzip -o "$ZIP" -d /tmp/pes-project
            PROJECT=$(find /tmp/pes-project -name settings.gradle.kts -print -quit)
            if [ -n "$PROJECT" ]; then
              cp -a "$(dirname "$PROJECT")"/. .
            fi
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PES2013-Android-APK
          path: app/build/outputs/apk/debug/*.apk
